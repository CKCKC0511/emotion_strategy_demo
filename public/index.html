<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>对话策略demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0f14;
        --panel: #131a23;
        --panel-soft: rgba(19, 26, 35, 0.82);
        --border: #243042;
        --text: #e8edf5;
        --muted: #8b98ab;
        --accent: #5b8cff;
        --user: #1c2a3b;
        --assistant: #121922;
        --chip: #1a2432;
        --danger: #f0b4bc;
        --danger-bg: #2a1518;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 20% -10%, #1a2740 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #13202e 0%, transparent 50%), var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1440px;
        margin: 0 auto;
        padding: 24px 18px 36px;
        min-height: 100vh;
      }
      header {
        margin-bottom: 18px;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.02em;
      }
      .sub {
        color: var(--muted);
        font-size: 0.92rem;
        margin: 6px 0 0;
        max-width: 900px;
        line-height: 1.55;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(360px, 1.05fr) minmax(420px, 1fr);
        gap: 16px;
        align-items: start;
      }
      .left-stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .panel {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel-soft);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }
      .panel-header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      .panel-title {
        font-size: 0.98rem;
        font-weight: 600;
      }
      .panel-meta {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .chat-panel {
        display: flex;
        flex-direction: column;
        height: 50vh;
        max-height: 50vh;
        min-height: 420px;
        position: sticky;
        top: 24px;
      }
      .session-panel {
        min-height: 220px;
      }
      .session-list {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .session-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(16, 23, 33, 0.72);
        padding: 12px;
      }
      .session-item .title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .session-item .meta {
        color: var(--muted);
        font-size: 0.82rem;
        margin-bottom: 10px;
      }
      .session-item .detail {
        margin-top: 10px;
      }
      .session-item pre {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msgs {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .bubble {
        max-width: 92%;
        padding: 12px 14px;
        border-radius: 14px;
        line-height: 1.55;
        font-size: 0.95rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .bubble.user {
        align-self: flex-end;
        background: var(--user);
        border: 1px solid var(--border);
      }
      .bubble.assistant {
        align-self: flex-start;
        background: var(--assistant);
        border: 1px solid #1c2633;
      }
      .bubble .role {
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 6px;
        letter-spacing: 0.04em;
      }
      .bubble .meta {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed var(--border);
        font-size: 0.82rem;
        color: var(--muted);
      }
      .composer {
        border-top: 1px solid var(--border);
        padding: 12px;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        background: rgba(12, 15, 20, 0.5);
        flex-shrink: 0;
      }
      textarea,
      button,
      input[type="number"],
      input[type="text"] {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      input[type="number"] {
        padding: 10px 12px;
      }
      input[type="text"] {
        padding: 10px 12px;
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 54px;
        max-height: 180px;
        padding: 12px;
      }
      textarea:focus {
        outline: 2px solid rgba(91, 140, 255, 0.35);
        outline-offset: 1px;
      }
      button {
        padding: 11px 18px;
        cursor: pointer;
        background: linear-gradient(145deg, #4a74e8, #3d5fc9);
        border: none;
        font-weight: 600;
        flex-shrink: 0;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .err {
        margin: 10px 16px 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--danger-bg);
        border: 1px solid #4a2329;
        color: var(--danger);
        font-size: 0.88rem;
        display: none;
      }
      .err.show {
        display: block;
      }
      .trace-panel {
        display: grid;
        grid-template-rows: auto auto 1fr;
      }
      .summary-strip {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .trace-tabs {
        display: flex;
        gap: 10px;
        padding: 12px 16px 0;
      }
      .trace-tab {
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(10, 15, 22, 0.45);
        color: var(--text);
        cursor: pointer;
        font-size: 0.88rem;
      }
      .trace-tab.active {
        background: rgba(91, 140, 255, 0.18);
        border-color: rgba(91, 140, 255, 0.55);
      }
      .summary-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(16, 23, 33, 0.65);
        padding: 12px;
      }
      .summary-card .label {
        color: var(--muted);
        font-size: 0.74rem;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .summary-card .value {
        font-size: 1.2rem;
        font-weight: 600;
      }
      .summary-card .subvalue {
        color: var(--muted);
        font-size: 0.82rem;
        margin-top: 6px;
      }
      .app-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .app-tab {
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(10, 15, 22, 0.45);
        color: var(--text);
        cursor: pointer;
        font-size: 0.92rem;
      }
      .app-tab.active {
        background: rgba(91, 140, 255, 0.18);
        border-color: rgba(91, 140, 255, 0.55);
      }
      [hidden] {
        display: none !important;
      }
      .trace-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
      }
      .trace-body.prompts-mode {
        grid-template-columns: minmax(0, 1fr);
      }
      .trace-body.prompts-mode .trace-main {
        grid-column: 1 / -1;
        width: 100%;
        max-width: 100%;
      }
      .trace-body.prompts-mode .node {
        width: 100%;
      }
      .trace-main {
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .trace-main.prompts-mode textarea {
        width: 100%;
        min-height: 220px;
        max-height: none;
      }
      .trace-side {
        border-left: 1px solid var(--border);
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .trace-side.hidden {
        display: none;
      }
      .node {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(16, 23, 33, 0.72);
        overflow: hidden;
      }
      .node-head {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      .node-title {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .node-meta {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .node-body {
        padding: 14px;
        display: grid;
        gap: 12px;
      }
      .kv-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .kv {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        background: rgba(10, 15, 22, 0.45);
      }
      .kv .k {
        color: var(--muted);
        font-size: 0.75rem;
        margin-bottom: 6px;
      }
      .kv .v {
        font-size: 1rem;
        font-weight: 600;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        background: var(--chip);
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 0.8rem;
      }
      .label {
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 6px;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.82rem;
        line-height: 1.5;
        color: #d7e1ef;
      }
      .block {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: rgba(10, 15, 22, 0.45);
      }
      .muted {
        color: var(--muted);
      }
      .danger {
        color: var(--danger);
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .score-item {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(10, 15, 22, 0.45);
        padding: 10px;
      }
      .score-item .name {
        color: var(--muted);
        font-size: 0.74rem;
        margin-bottom: 4px;
      }
      .score-item .score {
        font-size: 1rem;
        font-weight: 600;
      }
      .history-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: rgba(16, 23, 33, 0.55);
        cursor: pointer;
      }
      .history-item.active {
        border-color: rgba(91, 140, 255, 0.65);
        box-shadow: inset 0 0 0 1px rgba(91, 140, 255, 0.3);
      }
      .history-title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .history-text {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;
      }
      .placeholder {
        border: 1px dashed var(--border);
        border-radius: 14px;
        padding: 20px;
        color: var(--muted);
        text-align: center;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .stats-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(10, 15, 22, 0.45);
        padding: 12px;
      }
      .stats-card .title {
        font-weight: 600;
        margin-bottom: 8px;
      }
      .stat-line {
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.6;
      }
      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .control-row select {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .role-glaze-panel {
        min-height: calc(100vh - 220px);
      }
      .role-glaze-wrap {
        padding: 16px;
        display: grid;
        grid-template-columns: minmax(340px, 460px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .role-glaze-wrap.prompt-mode {
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 12px;
      }
      .role-glaze-form {
        display: grid;
        gap: 12px;
      }
      .role-glaze-form textarea {
        width: 100%;
        min-height: 100px;
        max-height: 240px;
      }
      .role-glaze-form input[type="text"] {
        width: 100%;
        padding: 12px;
      }
      #roleFengrongResult,
      #roleDianjingResult {
        min-width: 0;
      }
      #relationInitPanel .node-body textarea {
        width: 100%;
        min-height: 100px;
      }
      #roleFengrongResult.prompt-mode,
      #roleDianjingResult.prompt-mode {
        width: 100%;
      }
      #roleFengrongResult.prompt-mode .node,
      #roleDianjingResult.prompt-mode .node {
        width: 100%;
      }
      #roleFengrongResult.prompt-mode .node-body,
      #roleDianjingResult.prompt-mode .node-body {
        gap: 16px;
      }
      #roleFengrongResult.prompt-mode textarea,
      #roleDianjingResult.prompt-mode textarea {
        width: 100%;
        min-height: 340px;
        max-height: none;
        resize: vertical;
      }
      .sub-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .sub-tab {
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(10, 15, 22, 0.45);
        color: var(--text);
        cursor: pointer;
      }
      .sub-tab.active {
        background: rgba(91, 140, 255, 0.18);
        border-color: rgba(91, 140, 255, 0.55);
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        background: rgba(10, 15, 22, 0.45);
        font-weight: 600;
      }
      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .role-glaze-wrap {
          grid-template-columns: 1fr;
        }
        .trace-body {
          grid-template-columns: 1fr;
        }
        .trace-side {
          border-left: none;
          border-top: 1px solid var(--border);
        }
        .summary-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 720px) {
        .summary-strip,
        .kv-grid,
        .score-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>对话策略demo</h1>
      </header>

      <div class="app-tabs">
        <button type="button" class="app-tab active" id="appTabEmotionStrategy">情感策略demo</button>
        <button type="button" class="app-tab" id="appTabRoleFengrong">丰荣</button>
        <button type="button" class="app-tab" id="appTabRelationStrategy">关系策略demo</button>
        <button type="button" class="app-tab" id="appTabSimpleChat">无策略对话</button>
      </div>

      <div class="app-view" id="emotionStrategyView">
      <div class="layout">
        <div class="left-stack">
        <section class="panel chat-panel">
          <div class="panel-header">
            <div class="panel-title">对话区</div>
            <div class="panel-meta">与大模型直接对话</div>
          </div>
          <div id="err" class="err"></div>
          <div id="msgs" class="msgs"></div>
          <div class="composer">
            <textarea id="input" rows="2" placeholder="输入一句话，例如：你今天真让我很开心。"></textarea>
            <button type="button" id="send">发送</button>
          </div>
        </section>

        <section class="panel session-panel">
          <div class="panel-header">
            <div class="panel-title">自动评测 Session</div>
            <div class="panel-meta" id="sessionMeta">每轮对话后异步自动评测，不阻塞回复</div>
          </div>
          <div class="session-list" id="sessionList"></div>
        </section>
        </div>

        <section class="panel trace-panel">
          <div class="panel-header">
            <div class="panel-title">对话节点可视化</div>
            <div class="panel-meta" id="traceMeta">等待第一轮消息</div>
          </div>
          <div class="summary-strip" id="summaryStrip"></div>
          <div class="trace-tabs">
            <button type="button" class="trace-tab active" id="tabNodes">对话节点可视化</button>
            <button type="button" class="trace-tab" id="tabEvaluation">评测</button>
            <button type="button" class="trace-tab" id="tabRoleSettings">角色设定</button>
            <button type="button" class="trace-tab" id="tabPrompts">修改提示词</button>
            <button type="button" class="trace-tab" id="tabDianjing">情感策略点睛</button>
          </div>
          <div class="trace-body" id="traceBody">
            <div class="trace-main" id="traceMain"></div>
            <aside class="trace-side" id="traceSide">
              <div class="panel-title">轮次历史</div>
              <div class="panel-meta">点击右侧条目切换查看某一轮的节点详情</div>
              <div id="historyList"></div>
            </aside>
            <div id="roleDianjingView" hidden style="width:100%;overflow-y:auto;padding:8px 16px;">
              <div class="panel-meta" id="roleDianjingMeta" style="margin-bottom:10px;">输入角色基础信息后，生成剧本、状态表与状态优先级</div>
              <div id="roleDianjingWrap" style="display:flex;flex-direction:column;gap:16px;">
                <div class="role-glaze-form" id="roleDianjingForm" style="max-width:600px;"></div>
                <div id="roleDianjingResult"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
      </div>

      <div class="app-view" id="roleFengrongView" hidden>
        <section class="panel role-glaze-panel">
          <div class="panel-header">
            <div class="panel-title">丰荣</div>
            <div class="panel-meta" id="roleFengrongMeta">输入角色基础信息后，生成角色丰荣结果</div>
          </div>
          <div class="role-glaze-wrap" id="roleFengrongWrap">
            <div class="role-glaze-form" id="roleFengrongForm"></div>
            <div id="roleFengrongResult"></div>
          </div>
        </section>
      </div>


      <div class="app-view" id="relationStrategyView" hidden>
        <section class="panel" style="padding:18px;">
          <div class="sub-tabs" id="relationSubTabs"></div>
          <div id="relationInitPanel"></div>
          <div id="relationChatPanel" hidden></div>
          <div id="relationPromptPanel" hidden></div>
        </section>
      </div>

      <div class="app-view" id="simpleChatView" hidden>
        <section class="panel" style="padding:18px;">
          <div class="sub-tabs" id="simpleChatSubTabs"></div>
          <div id="simpleChatTabChat"></div>
          <div id="simpleChatTabPrompt" hidden></div>
        </section>
      </div>
    </div>

    <script>
      const INITIAL_IDT = { i: 15, d: 80, t: 30 };
      const STATE_LABELS = {
        obsession: {
          label: "极度羁绊",
          priorityBand: "P1",
          priority: 1,
          perception: "极端的亲昵交织着彻底的失控与高能情绪，让他沉溺于无可救药的迷恋中。",
          rangeText: "I[85,100] D[0,19] T[85,100]",
        },
        breakdown: {
          label: "失控破防",
          priorityBand: "P2",
          priority: 2,
          perception: "彻底丧失掌控权且情绪极度紧绷，让他感到前所未有的恐慌与应激。",
          rangeText: "I[0,100] D[0,29] T[80,100]",
        },
        pushPull: {
          label: "试探推拉",
          priorityBand: "P3",
          priority: 3,
          perception: "掌控力开始动摇，情绪张力逐渐升高，未知的诱惑让他既警惕又兴奋。",
          rangeText: "I[0,100] D[40,60] T[40,75]",
        },
        dailyFallback: {
          label: "日常兜底",
          priorityBand: "P4",
          priority: 4,
          perception: "当前掌控力充足且情绪平稳，让他感到一切都在理性分析的预期内。",
          rangeText: "I[0,100] D[50,100] T[0,60]",
        },
      };
      const STATE_CODE_ORDER = ["obsession", "breakdown", "pushPull", "dailyFallback"];
      const ROLE_STATE_LABEL_TO_CODE = {
        日常兜底: "dailyFallback",
        试探推拉: "pushPull",
        "试探与推拉": "pushPull",
        失控破防: "breakdown",

      function buildDefaultRoleStateConfig() {
        return STATE_CODE_ORDER.map((code) => {
          const meta = STATE_LABELS[code];
          const ranges = String(meta.rangeText || "").match(/I\[(\d+),(\d+)\]\s+D\[(\d+),(\d+)\]\s+T\[(\d+),(\d+)\]/);
          return {
            code,
            label: meta.label,
            priorityBand: meta.priorityBand,
            priority: meta.priority,
            perception: meta.perception,
            range: {
              iMin: ranges ? Number(ranges[1]) : 0,
              iMax: ranges ? Number(ranges[2]) : 100,
              dMin: ranges ? Number(ranges[3]) : 0,
              dMax: ranges ? Number(ranges[4]) : 100,
              tMin: ranges ? Number(ranges[5]) : 0,
              tMax: ranges ? Number(ranges[6]) : 100,
            },
          };
        });
      }

      function cloneRoleStateConfig(config) {
        return (config || buildDefaultRoleStateConfig()).map((item) => ({
          ...item,
          range: { ...item.range },
        }));
      }

      function parsePriorityValue(priorityBand, fallback = 99) {
        const match = String(priorityBand || "").match(/(\d+)/);
        return match ? Number(match[1]) : fallback;
      }

      function buildRangeText(range) {
        return `I[${range.iMin},${range.iMax}] D[${range.dMin},${range.dMax}] T[${range.tMin},${range.tMax}]`;
      }

      function parseRangePair(value) {
        const text = String(value ?? "").trim();
        const bracketMatch = text.match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)/);
        if (!bracketMatch) return null;
        return [Number(bracketMatch[1]), Number(bracketMatch[2])];
      }

      function normalizePriorityBand(value) {
        if (value === null || value === undefined) return "";
        const text = String(value).trim();
        if (!text) return "";
        if (/^P\d+$/i.test(text)) return text.toUpperCase();
        if (/^\d+$/.test(text)) return `P${text}`;
        return text;
      }

      function round2(value) {
        return Math.round(value * 100) / 100;
      }

      function calcAverage(values) {
        if (!values.length) return null;
        return round2(values.reduce((sum, value) => sum + value, 0) / values.length);
      }

      function calcMedian(values) {
        if (!values.length) return null;
        const sorted = [...values].sort((a, b) => a - b);
        const middle = Math.floor(sorted.length / 2);
        if (sorted.length % 2 === 0) {
          return round2((sorted[middle - 1] + sorted[middle]) / 2);
        }
        return sorted[middle];
      }

      function calcModes(values) {
        if (!values.length) return [];
        const counts = new Map();
        for (const value of values) {
          counts.set(value, (counts.get(value) || 0) + 1);
        }
        const maxCount = Math.max(...counts.values());
        return [...counts.entries()]
          .filter(([, count]) => count === maxCount)
          .map(([value]) => value)
          .sort((a, b) => a - b);
      }

      function summarizeEvaluationRounds(rounds) {

        const settingScores = successful.map((item) => item.setting.score);

        const averageScores = successful.map((item) => item.averageScore);

        return {
          totalRounds: rounds.length,
          successfulRounds: successful.length,
          failedRounds: rounds.length - successful.length,
          setting: {
            average: calcAverage(settingScores),
            median: calcMedian(settingScores),
            modes: calcModes(settingScores),
          },
          state: {
            average: calcAverage(stateScores),
            median: calcMedian(stateScores),
            modes: calcModes(stateScores),
          },
          overall: {
            average: calcAverage(averageScores),
            median: calcMedian(averageScores),
            modes: calcModes(averageScores),
          },
        };
      }

        if (!entries.length) {
          return `<div class="placeholder">生成完成后，这里会展示各状态的行动指令。</div>`;
        }
        return entries
          .map(
            ([stateKey, item]) => `
              <section class="node">
                <div class="node-head">
                  <div class="node-title">${escapeHtml(stateKey)}</div>
                  <div class="node-meta">行动指令</div>
                </div>
                <div class="node-body">
                  <div>
                    <div class="label">语气</div>
                    <div class="block"><pre>${escapeHtml(item?.tone || "-")}</pre></div>
                  </div>
                  <div>
                    <div class="label">动作描写方向</div>
                    <div class="block"><pre>${escapeHtml(item?.actionDirection || "-")}</pre></div>
                  </div>
                </div>
              </section>
            `
          )
          .join("");
      }

      function renderSimpleTable(headers, rows) {
        if (!rows.length) {
          return `<div class="placeholder">生成完成后，这里会显示内容。</div>`;
        }
        return `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>${headers.map((item) => `<th>${escapeHtml(item)}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${rows
                  .map(
                    (row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell ?? "-")}</td>`).join("")}</tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        `;
      }

              <div class="node-title">修改提示词</div>

              <div>
                <div class="label">${isFengrong ? "丰荣提示词" : "点睛提示词"}</div>

      function bindRoleBaseFormEvents(kind) {
        const isFengrong = kind === "fengrong";
        const prefix = isFengrong ? "roleFengrong" : "roleDianjing";
        const target = isFengrong ? roleFengrongInput : roleDianjingInput;
        const fieldMap = {
          [`${prefix}NameInput`]: "name",
          [`${prefix}GenderInput`]: "gender",
          [`${prefix}CoreTagsInput`]: "coreTags",
          [`${prefix}TaglineInput`]: "tagline",
          [`${prefix}OpenerInput`]: "opener",
        };

        Object.entries(fieldMap).forEach(([elementId, key]) => {
          const field = document.getElementById(elementId);
          if (!field) return;
          field.addEventListener("input", (event) => {
            target[key] = event.target.value;
          });
        });

        const runButton = document.getElementById(`${prefix}RunButton`);
        if (runButton) {
          runButton.addEventListener("click", isFengrong ? runRoleFengrongGeneration : runRoleDianjingGeneration);

      async function runRoleFengrongGeneration() {
        if (roleFengrongLoading) return;
        const missing = Object.entries(roleFengrongInput).filter(([, value]) => !String(value || "").trim());
        if (missing.length) {
          showErr(`请先填写完整字段：${missing.map(([key]) => ROLE_GLAZE_FIELD_LABELS[key] || key).join("、")}`);
          return;
        }

        showErr("");
        roleFengrongLoading = true;
        roleFengrongResult = null;
        roleFengrongMetaEl.textContent = "丰荣生成中：正在生成角色丰荣结果";
        renderRoleBaseForm({
          formEl: roleFengrongFormEl,
          input: roleFengrongInput,
          actionId: "roleFengrong",
          buttonLabel: "生成丰荣结果",
          loadingLabel: "丰荣生成中...",
          metaText: "基于角色基础信息生成丰荣结果",
        });
        bindRoleBaseFormEvents("fengrong");
        renderRoleFengrongResult();
        bindRoleFengrongResultEvents();

        try {
          const response = await fetch("/api/role-fengrong", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ...roleFengrongInput,
              rolePromptOverrides: { fengrongPrompt: currentRolePromptOverrides().fengrongPrompt },
            }),
          });
          const data = await readApiResponse(response);
          if (!response.ok) {
            throw new Error(data.error?.message || data.error || (typeof data === "string" ? data : JSON.stringify(data)));
          }
          roleFengrongResult = data;
          activeRoleFengrongSubTab = "result";
          roleFengrongMetaEl.textContent = "生成完成：可以查看丰荣结果或修改提示词";
        } catch (error) {
          showErr(error instanceof Error ? error.message : String(error));
          roleFengrongMetaEl.textContent = "生成失败，请检查输入或稍后重试";
        } finally {
          roleFengrongLoading = false;
          renderRoleBaseForm({
            formEl: roleFengrongFormEl,
            input: roleFengrongInput,
            actionId: "roleFengrong",
            buttonLabel: "生成丰荣结果",
            loadingLabel: "",
            metaText: "基于角色基础信息生成丰荣结果",
          });
          bindRoleBaseFormEvents("fengrong");
          renderRoleFengrongResult();
          bindRoleFengrongResultEvents();
          bindRolePromptEditorEvents("fengrong");
        }
      }

      async function runRoleDianjingGeneration() {
        if (roleDianjingLoadingStage) return;
        const missing = Object.entries(roleDianjingInput).filter(([, value]) => !String(value || "").trim());
        if (missing.length) {
          showErr(`请先填写完整字段：${missing.map(([key]) => ROLE_GLAZE_FIELD_LABELS[key] || key).join("、")}`);
          return;
        }

        showErr("");
        roleDianjingResult = null;
        roleDianjingLoadingStage = "dianjing";
        roleDianjingMetaEl.textContent = "点睛生成中：正在根据当前输入生成剧本、状态表和状态优先级";
        renderRoleBaseForm({
          formEl: roleDianjingFormEl,
          input: roleDianjingInput,
          actionId: "roleDianjing",
          buttonLabel: "生成点睛结果",
          loadingLabel: "点睛生成中...",
          metaText: "基于角色基础信息生成点睛结果",
        });
        bindRoleBaseFormEvents("dianjing");
        renderRoleDianjingResult();
        bindRoleDianjingResultEvents();

        try {
          roleDianjingResult = { input: { ...roleDianjingInput }, dianjing: null };

          const dianjingResponse = await fetch("/api/role-dianjing", {

            body: JSON.stringify({

              rolePromptOverrides: { dianjingPrompt: currentRolePromptOverrides().dianjingPrompt },

            );

          roleDianjingResult = {
            ...dianjingData,
          };
          roleDianjingMetaEl.textContent = "生成完成：可以查看剧本、状态表、状态优先级或修改提示词";

          showErr(error instanceof Error ? error.message : String(error));
          roleDianjingMetaEl.textContent = "生成失败，请检查输入或稍后重试";
        } finally {
          roleDianjingLoadingStage = "";
          renderRoleBaseForm({
            formEl: roleDianjingFormEl,
            input: roleDianjingInput,
            actionId: "roleDianjing",
            buttonLabel: "生成点睛结果",
            loadingLabel: "",

        ).join(" ");
        return `

            <div class="node-head">
              <div class="node-title">生成结果</div>

            </div>

              <div>
                <div class="label">关系阶段设定</div>
                <table class="simple-table"><thead><tr><th>关系阶段</th><th>核心态度</th><th>底线边界</th></tr></thead><tbody>${stageRows || "<tr><td colspan='3'>暂无</td></tr>"}</tbody></table>

      function bindRelationInitEvents() {
        const taglineField = document.getElementById("relationTaglineInput");
        const userSetField = document.getElementById("relationUserSetInput");
        if (taglineField) taglineField.addEventListener("input", (e) => { relationInitInput.tagline = e.target.value; });
        if (userSetField) userSetField.addEventListener("input", (e) => { relationInitInput.userSet = e.target.value; });

        const runBtn = document.getElementById("relationInitRunBtn");
        if (runBtn) runBtn.addEventListener("click", runRelationInit);

        const applyBtn = document.getElementById("relationApplyBtn");
        if (applyBtn) applyBtn.addEventListener("click", applyRelationConfig);
      }

      async function runRelationInit() {
        if (relationInitLoading) return;
        if (!relationInitInput.tagline.trim() || !relationInitInput.userSet.trim()) {
          showErr("请填写 Tagline 和用户设定");
          return;
        }
        showErr("");
        relationInitLoading = true;
        relationInitResult = null;
        relationConfigApplied = false;
        renderRelationInitTab();
        try {
          const response = await fetch("/api/relation-init", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tagline: relationInitInput.tagline, userSet: relationInitInput.userSet, relationPromptOverrides: currentRelationPromptOverrides() }),
          });
          const data = await readApiResponse(response);
          if (!response.ok) throw new Error(data.error || JSON.stringify(data));
          relationInitResult = data;
        } catch (error) {
          showErr(error instanceof Error ? error.message : String(error));
        } finally {
          relationInitLoading = false;
          renderRelationInitTab();
        }
      }

      function applyRelationConfig() {
        if (!relationInitResult) return;
        relationConfigApplied = true;
        relationCurrentStage = relationInitResult.initialStage || "";
        relationStageSettings = relationInitResult.stageSettings || [];
        relationEvolutionStages = relationInitResult.evolutionStages || [];
        relationChatHistory = [];
        relationRoundCounter = 0;
        relationCurrentAtmosphere = "";
        relationTransitionHistory = [];
        renderRelationInitTab();
      }

      function getRelationStageSetting(stage) {
        const found = relationStageSettings.find((s) =>
          (s.stage || s["关系阶段"] || "") === stage
        );
        if (!found) return { coreAttitude: "", boundary: "" };
        return {
          coreAttitude: found.coreAttitude || found["核心态度"] || "",
          boundary: found.boundary || found["底线边界"] || "",
        };
      }

      function getRelationNextStage() {
        const stages = [relationCurrentStage, ...relationEvolutionStages];
        const idx = stages.indexOf(relationCurrentStage);
        if (idx >= 0 && idx < stages.length - 1) return stages[idx + 1];
        return relationEvolutionStages[0] || "";
      }

      function formatRelationChatHistory() {
        return relationChatHistory
          .filter((m) => m.role !== "system")
          .map((m) => `${m.role === "user" ? "用户" : "角色"}：${m.content}`)
          .join("\n");
      }

      function renderRelationChatTab() {
        if (!relationConfigApplied) {
          relationChatPanelEl.innerHTML = `
            <section class="node">
              <div class="node-head"><div class="node-title">关系策略对话</div></div>
              <div class="node-body">
                <div class="muted">请先前往「关系初始阶段判定与定义」完成角色关系设定初始化，并点击"应用到关系策略对话"后再开始对话。</div>
              </div>
            </section>`;
          return;
        }
        const nextStage = getRelationNextStage();
        const curSetting = getRelationStageSetting(relationCurrentStage);
        const bubbles = relationChatHistory
          .filter((m) => m.role !== "system")
          .map((m) => `<div class="bubble ${m.role}">${escapeHtml(m.content)}</div>`)
          .join("");

        const t = relationRoundTrace;
        const traceHtml = buildRelationTraceHtml(t, nextStage);
        const transitionRows = relationTransitionHistory.map((tr) =>
          `<div class="chip-row"><span class="chip">${escapeHtml(tr.from)} → ${escapeHtml(tr.to)}</span><span class="muted" style="margin-left:8px;">第${tr.round}轮 · ${escapeHtml(tr.reason)}</span></div>`
        ).join("");

        relationChatPanelEl.innerHTML = `
          <div class="layout">
            <div class="left-stack">
              <section class="panel chat-panel">
                <div class="panel-header">
                  <div class="panel-title">关系策略对话</div>
                  <div class="panel-meta">第 ${relationRoundCounter} 轮 · 关系阶段：${escapeHtml(relationCurrentStage)} · 氛围：${escapeHtml(relationCurrentAtmosphere || "待判定")}</div>
                </div>
                <div id="relationErr" class="err"></div>
                <div class="msgs" id="relationMsgs">${bubbles}</div>

      function buildRelationTraceHtml(t, nextStage) {
        if (!t) return `<div class="muted">发送消息后将在此展示本轮全链路节点结果</div>`;
        let html = "";

        html += `<section class="node">
          <div class="node-head"><div class="node-title">跃迁判定</div></div>
          <div class="node-body">`;
        if (!t.transition) {
          html += `<div class="muted">加载中...</div>`;
        } else if (!t.transition.checked) {
          html += `<div>本轮未触发跃迁判定（每 10 轮判定一次）</div>
            <div class="label" style="margin-top:4px;">距下次跃迁判定还有 <strong>${t.roundsUntilTransitionCheck}</strong> 轮</div>`;
        } else {
          html += `<div><span class="label">判定结果</span>：${t.transition.shouldTransition
            ? `<span style="color:#6cf;">跃迁发生</span> · ${escapeHtml(t.transition.from)} → ${escapeHtml(t.transition.to)}`
            : `<span style="color:var(--muted);">未跃迁</span>`}</div>`;
          if (t.transition.reason) html += `<div><span class="label">理由</span>：${escapeHtml(t.transition.reason)}</div>`;
          if (t.transition.inputPrompt) html += `<details style="margin-top:4px;"><summary class="label" style="cursor:pointer;">展开查看完整输入提示词</summary><div class="block"><pre style="white-space:pre-wrap;max-height:300px;overflow-y:auto;">${escapeHtml(t.transition.inputPrompt)}</pre></div></details>`;
        }
        html += `</div></section>`;

        html += `<section class="node" style="margin-top:8px;">
          <div class="node-head"><div class="node-title">对话氛围判定</div></div>
          <div class="node-body">`;
        if (!t.atmosphere) {
          html += `<div class="muted">判定中...</div>`;
        } else {
          html += `<div><span class="label">氛围</span>：<strong>${escapeHtml(t.atmosphere.chatAtm || "无")}</strong></div>`;
          if (t.atmosphere.latencyMs) html += `<div><span class="label">耗时</span>：${t.atmosphere.latencyMs} ms</div>`;
          if (t.atmosphere.inputPrompt) html += `<details style="margin-top:4px;"><summary class="label" style="cursor:pointer;">展开查看完整输入提示词</summary><div class="block"><pre style="white-space:pre-wrap;max-height:300px;overflow-y:auto;">${escapeHtml(t.atmosphere.inputPrompt)}</pre></div></details>`;
        }
        html += `</div></section>`;

        html += `<section class="node" style="margin-top:8px;">
          <div class="node-head"><div class="node-title">关系阶段二次生成</div></div>
          <div class="node-body">`;
        if (t.regeneration === null) {
          const remaining = relationEvolutionStages.length;
          html += `<div>未触发（剩余演进阶段：${remaining} 个）</div>`;
        } else if (t.regeneration.triggered) {
          if (t.regeneration.result && t.regeneration.result.length > 0) {
            html += `<div><span style="color:#6cf;">已触发</span> · 新生成 ${t.regeneration.result.length} 个演进阶段</div>`;
            html += `<div class="chip-row" style="margin-top:4px;">${t.regeneration.result.map((s) => `<span class="chip">${escapeHtml(String(s))}</span>`).join(" → ")}</div>`;
          } else {
            html += `<div><span style="color:#6cf;">已触发</span> · 生成失败或为空</div>`;
          }
          if (t.regeneration.inputPrompt) html += `<details style="margin-top:4px;"><summary class="label" style="cursor:pointer;">展开查看完整输入提示词</summary><div class="block"><pre style="white-space:pre-wrap;max-height:300px;overflow-y:auto;">${escapeHtml(t.regeneration.inputPrompt)}</pre></div></details>`;
        }
        html += `</div></section>`;

        html += `<section class="node" style="margin-top:8px;">
          <div class="node-head"><div class="node-title">System Prompt</div></div>
          <div class="node-body">`;
        if (t.systemPrompt) {

          html += `<div class="muted">加载中...</div>`;

        html += `</div></section>`;

        return html;

      function bindRelationChatEvents() {
        const sendBtn = document.getElementById("relationSendBtn");
        const inputField = document.getElementById("relationInput");
        if (sendBtn) sendBtn.addEventListener("click", sendRelationMessage);
        if (inputField) inputField.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendRelationMessage(); }
        });
      }

      function showRelationErr(msg) {
        const el = document.getElementById("relationErr");
        if (el) el.textContent = msg || "";
      }

      async function sendRelationMessage() {
        const inputField = document.getElementById("relationInput");
        const text = inputField?.value?.trim();
        if (!text || relationChatLoading) return;
        showRelationErr("");
        inputField.value = "";
        relationChatHistory.push({ role: "user", content: text });
        relationChatLoading = true;

        const trace = {
          round: relationRoundCounter + 1,
          transition: null,
          roundsUntilTransitionCheck: 0,
          atmosphere: null,
          regeneration: null,
          systemPrompt: "",
        };
        relationRoundTrace = trace;
        renderRelationChatTab();

        const nextStage = getRelationNextStage();
        const curSetting = getRelationStageSetting(relationCurrentStage);
        const nextSetting = getRelationStageSetting(nextStage);

        try {
          const chatRes = await fetch("/api/relation-chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: relationChatHistory,
              relationConfig: {
                gender: "男",
                tagline: relationInitInput.tagline,
                stageCur: relationCurrentStage,
                stageSetting: `核心态度：${curSetting.coreAttitude}；底线边界：${curSetting.boundary}`,
                chatAtm: relationCurrentAtmosphere,
                stageNext: nextStage,
                nextCoreAttitude: nextSetting.coreAttitude,
                nextBoundary: nextSetting.boundary,
              },
              relationPromptOverrides: currentRelationPromptOverrides(),
            }),
          });
          const chatData = await readApiResponse(chatRes);
          if (!chatRes.ok) throw new Error(chatData.error || JSON.stringify(chatData));

          const assistantContent = chatData.assistant?.content || "";
          relationChatHistory.push({ role: "assistant", content: assistantContent });
          relationRoundCounter += 1;
          trace.round = relationRoundCounter;
          trace.systemPrompt = chatData.systemPrompt || "";
        } catch (error) {
          showRelationErr(error instanceof Error ? error.message : String(error));
          relationChatLoading = false;
          renderRelationChatTab();
          return;
        }

        relationChatLoading = false;
        const isTransitionRound = relationRoundCounter > 0 && relationRoundCounter % 10 === 0;
        trace.roundsUntilTransitionCheck = isTransitionRound ? 0 : (10 - (relationRoundCounter % 10));
        renderRelationChatTab();

        (async () => {
          try {
            const chatHistoryStr = formatRelationChatHistory();
            const atmRes = await fetch("/api/relation-atmosphere", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                tagline: relationInitInput.tagline,
                chatHistory: chatHistoryStr,
                relationPromptOverrides: currentRelationPromptOverrides(),
              }),
            });
            const atmData = await readApiResponse(atmRes);
            if (atmRes.ok && atmData.chatAtm) {
              relationCurrentAtmosphere = atmData.chatAtm;
            }
            trace.atmosphere = {
              chatAtm: atmData.chatAtm || "",
              rawOutput: atmData.rawOutput || "",
              inputPrompt: atmData.inputPrompt || "",
              latencyMs: atmData.trace?.latencyMs || 0,
            };
            renderRelationChatTab();
          } catch {}
        })();

        if (isTransitionRound) {
          (async () => {
            try {
              const transRes = await fetch("/api/relation-transition", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  tagline: relationInitInput.tagline,
                  chatHistory: formatRelationChatHistory(),
                  stageSet: JSON.stringify(relationStageSettings),
                  stageCur: relationCurrentStage,
                  stageNext: getRelationNextStage(),
                  relationPromptOverrides: currentRelationPromptOverrides(),
                }),
              });
              const transData = await readApiResponse(transRes);
              trace.transition = {
                checked: true,
                shouldTransition: transData.shouldTransition || false,
                from: transData.from || relationCurrentStage,
                to: transData.to || "",
                reason: transData.reason || "",
                rawOutput: transData.rawOutput || "",
                inputPrompt: transData.inputPrompt || "",
              };
              if (transRes.ok && transData.shouldTransition) {
                relationTransitionHistory.push({
                  round: relationRoundCounter,
                  from: transData.from || relationCurrentStage,
                  to: transData.to || getRelationNextStage(),
                  reason: transData.reason || "",
                });
                relationCurrentStage = transData.to || getRelationNextStage();
                const idx = relationEvolutionStages.indexOf(relationCurrentStage);
                if (idx >= 0) relationEvolutionStages = relationEvolutionStages.slice(idx + 1);
              }
              renderRelationChatTab();

              if (relationEvolutionStages.length === 0) {
                await triggerRelationRegenerate(trace);
              }
            } catch {}
          })();
        } else {
          trace.transition = { checked: false, shouldTransition: false, from: "", to: "", reason: "", rawOutput: "" };
          if (relationEvolutionStages.length === 0) {
            (async () => { await triggerRelationRegenerate(trace); })();
          }
        }
      }

      async function triggerRelationRegenerate(trace) {
        try {
          const regenRes = await fetch("/api/relation-regenerate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              tagline: relationInitInput.tagline,
              stageCur: relationCurrentStage,
              stageSet: JSON.stringify(relationStageSettings),
              relationPromptOverrides: currentRelationPromptOverrides(),
            }),
          });
          const regenData = await readApiResponse(regenRes);
          const newStages = regenData.evolutionStages || [];
          trace.regeneration = { triggered: true, result: newStages, rawOutput: regenData.rawOutput || "", inputPrompt: regenData.inputPrompt || "" };
          if (regenRes.ok && newStages.length > 0) {
            relationEvolutionStages = newStages;
          }
          renderRelationChatTab();
        } catch (e) {
          trace.regeneration = { triggered: true, result: null, rawOutput: String(e) };
          renderRelationChatTab();
        }
      }

        const response = await fetch("/api/prompt-defaults");

        promptDefaults = {
          ...data,
          replyPrompt: normalizeReplyPromptTemplate(data.replyPrompt),
        };
        promptOverrides = {
          replyPrompt: promptDefaults.replyPrompt,
          scorePrompt: promptDefaults.scorePrompt,
          evaluationPrompt: promptDefaults.evaluationPrompt,
          userSimulationPrompt: promptDefaults.userSimulationPrompt,

      function bindPromptEditorEvents() {
        if (!promptOverrides || !promptDefaults) return;

        const fieldMap = {
          promptReply: "replyPrompt",
          promptScore: "scorePrompt",
          promptUserSimulation: "userSimulationPrompt",
          promptEvaluation: "evaluationPrompt",
        };

        Object.entries(fieldMap).forEach(([elementId, key]) => {
          const field = document.getElementById(elementId);
          if (!field) return;
          field.addEventListener("input", (event) => {
            promptOverrides[key] = event.target.value;
          });
        });

        const dianjingField = document.getElementById("promptDianjing");
        if (dianjingField && rolePromptOverrides) {
          dianjingField.addEventListener("input", (event) => {
            rolePromptOverrides.dianjingPrompt = event.target.value;
          });
        }

        document.querySelectorAll("[data-reset-prompt]").forEach((button) => {
          button.addEventListener("click", () => {
            const key = button.getAttribute("data-reset-prompt");
            if (!key) return;
            if (key === "dianjingPrompt" && rolePromptOverrides && rolePromptDefaults) {
              rolePromptOverrides.dianjingPrompt = rolePromptDefaults.dianjingPrompt;
            } else {
              promptOverrides[key] = promptDefaults[key];
            }
            renderTrace();
          });
        });

        const resetAllButton = document.getElementById("resetAllPrompts");
        if (resetAllButton) {
          resetAllButton.addEventListener("click", () => {
            promptOverrides = {
              replyPrompt: promptDefaults.replyPrompt,
              scorePrompt: promptDefaults.scorePrompt,
              evaluationPrompt: promptDefaults.evaluationPrompt,
              userSimulationPrompt: promptDefaults.userSimulationPrompt,
            };
            if (rolePromptOverrides && rolePromptDefaults) {
              rolePromptOverrides.dianjingPrompt = rolePromptDefaults.dianjingPrompt;
            }
            renderTrace();
          });
        }
      }

      function bindRolePromptEditorEvents(kind) {
        if (!rolePromptOverrides || !rolePromptDefaults) return;

        const isFengrong = kind === "fengrong";
        const fieldMap = isFengrong
          ? { rolePromptFengrong: "fengrongPrompt" }
          : { rolePromptDianjing: "dianjingPrompt" };

        Object.entries(fieldMap).forEach(([elementId, key]) => {

          field.addEventListener("input", (event) => {
            rolePromptOverrides[key] = event.target.value;

        });

          button.addEventListener("click", () => {
            const key = button.getAttribute("data-reset-role-prompt");
            if (!key) return;
            if (isFengrong && key !== "fengrongPrompt") return;
            if (!isFengrong && key !== "dianjingPrompt") return;
            rolePromptOverrides[key] = rolePromptDefaults[key];

              renderRoleFengrongResult();
              bindRoleFengrongResultEvents();

              renderRoleDianjingResult();
              bindRoleDianjingResultEvents();

          });
        });

        const resetAllButton = document.getElementById(
          isFengrong ? "resetFengrongPrompt" : "resetDianjingPrompt"
        );

          resetAllButton.addEventListener("click", () => {

              rolePromptOverrides.fengrongPrompt = rolePromptDefaults.fengrongPrompt;
              renderRoleFengrongResult();

      function bindRoleSettingsEvents() {
        const kFieldMap = {
          kInputKi: "ki",
          kInputKd: "kd",
          kInputKt: "kt",
        };

        Object.entries(kFieldMap).forEach(([elementId, key]) => {
          const field = document.getElementById(elementId);
          if (!field) return;
          field.addEventListener("input", (event) => {
            kConfig[key] = event.target.value;
          });
        });

        const resetKButton = document.getElementById("resetKConfig");
        if (resetKButton) {
          resetKButton.addEventListener("click", () => {
            kConfig = { ki: 1, kd: 1, kt: 1 };
            renderTrace();
          });
        }

        document.querySelectorAll("[data-role-state-perception]").forEach((field) => {
          field.addEventListener("input", (event) => {
            const code = event.target.getAttribute("data-role-state-perception");
            const target = currentRoleStateConfig().find((item) => item.code === code);
            if (!target) return;
            target.perception = event.target.value;
          });
        });

        document.querySelectorAll("[data-role-state-range]").forEach((field) => {
          field.addEventListener("input", (event) => {
            const token = event.target.getAttribute("data-role-state-range") || "";
            const [code, key] = token.split(":");
            const target = currentRoleStateConfig().find((item) => item.code === code);
            if (!target || !key) return;
            const parsed = Number(event.target.value);
            target.range[key] = Number.isFinite(parsed) ? Math.max(0, Math.min(100, parsed)) : target.range[key];
          });
        });

        document.querySelectorAll("[data-role-state-priority]").forEach((field) => {
          field.addEventListener("input", (event) => {
            const code = event.target.getAttribute("data-role-state-priority");
            const target = currentRoleStateConfig().find((item) => item.code === code);
            if (!target) return;
            target.priorityBand = event.target.value;
            target.priority = parsePriorityValue(event.target.value, target.priority);
          });
        });

        document.querySelectorAll("[data-reset-role-state]").forEach((button) => {
          button.addEventListener("click", () => {
            const code = button.getAttribute("data-reset-role-state");
            const fallback = cloneRoleStateConfig().find((item) => item.code === code);
            const index = currentRoleStateConfig().findIndex((item) => item.code === code);
            if (!fallback || index === -1) return;
            roleStateConfig[index] = fallback;
            renderTrace();
          });
        });

        const resetRoleStateButton = document.getElementById("resetRoleStateConfig");
        if (resetRoleStateButton) {
          resetRoleStateButton.addEventListener("click", () => {
            roleStateConfig = cloneRoleStateConfig();
            renderTrace();
          });
        }
      }

      function renderTrace() {
        const isDianjing = activeTraceTab === "dianjing";
        const singlePaneMode =
          activeTraceTab === "prompts" ||
          activeTraceTab === "evaluation" ||
          activeTraceTab === "roleSettings" ||
          isDianjing;
        traceBodyEl.classList.toggle("prompts-mode", singlePaneMode);
        traceMainEl.classList.toggle("prompts-mode", singlePaneMode);
        traceSideEl.classList.toggle("hidden", singlePaneMode);

        roleDianjingViewEl.hidden = !isDianjing;
        traceMainEl.hidden = isDianjing;
        if (isDianjing) {
          traceMainEl.innerHTML = "";
          traceMetaEl.textContent = "输入角色基础信息后，生成剧本、状态表与状态优先级";
          renderDianjingInTracePanel();
          return;
        }

        renderSummary();
        renderHistory();

        const active = latestTrace();
        if (!active) {
          traceMetaEl.textContent =
            activeTraceTab === "prompts" || activeTraceTab === "roleSettings"
              ? "当前修改只在本次页面会话中生效"
              : "等待第一轮消息";
          traceMainEl.innerHTML =
            activeTraceTab === "roleSettings"
              ? renderRoleSettingsEditor()
              : activeTraceTab === "prompts"
              ? renderPromptEditor()
              : activeTraceTab === "evaluation"
              ? renderStandaloneEvaluationTab()
              : `<div class="placeholder"></div>`;
          const runEvalBatchBtn = document.getElementById("runEvalBatch");
          if (runEvalBatchBtn) {
            runEvalBatchBtn.addEventListener("click", () => runEvaluationBatch(null));
          }
          if (activeTraceTab === "prompts") {
            bindPromptEditorEvents();
          }
          if (activeTraceTab === "roleSettings") {
            bindRoleSettingsEvents();
          }
          return;
        }

        traceMetaEl.textContent =
          activeTraceTab === "prompts" || activeTraceTab === "roleSettings"
            ? "当前修改只在本次页面会话中生效"
            : `第 ${active.roundNo} 轮，总耗时 ${fmt(active.trace.requestLatencyMs)}ms`;

        const scoring = active.trace.scoring;
        const pad = active.trace.pad;
        const idt = active.trace.idt;
        const routes = active.trace.routes;
        const routeText = routes.matches?.length
          ? routes.matches.map((item) => formatRouteItem(item)).join(", ")
          : routes.unmatched
            ? "unmatched"
            : "未命中";
        const primaryRouteText = routes.primary ? formatRouteItem(routes.primary) : "-";
        const primaryPerception = routes.primary?.perception || "-";
        const stateRules = (active.trace.stateMeta || currentRoleStateConfig())
          .sort((a, b) => a.priority - b.priority)
          .map(
            (state) =>
              `${state.label} (${state.priorityBand}, 优先级 ${state.priority}): ${buildRangeText(
                state.range
              )}\n数值感知：${state.perception}`
          )
          .join("\n\n");

        traceMainEl.innerHTML =
          activeTraceTab === "roleSettings"
            ? renderRoleSettingsEditor()
            : activeTraceTab === "prompts"
            ? renderPromptEditor()
            : activeTraceTab === "evaluation"
              ? renderEvaluationTab(active)
              : [
          nodeTemplate(
            "UserInput",
            "本轮用户输入",
            `
              <div>
                <div class="label">输入内容</div>
                <div class="block"><pre>${escapeHtml(active.trace.userInput)}</pre></div>
              </div>
            `
          ),
          nodeTemplate(
            "Q1~Q12 Scoring",
            scoring.latencyMs ? `耗时 ${fmt(scoring.latencyMs)}ms` : "评分未完成",
            `
              ${scoring.error ? `<div class="danger">评分异常：${escapeHtml(scoring.error)}</div>` : ""}
              <div>
                <div class="label">评分输入</div>
                <div class="block"><pre>${escapeHtml(scoring.input)}</pre></div>
              </div>
              <div>
                <div class="label">Q1~Q12 输出</div>
                ${renderQScores(scoring.qScores)}
              </div>
              <div>
                <div class="label">情绪总结</div>
                <div class="block"><pre>${escapeHtml(scoring.summary || "-")}</pre></div>
              </div>
              <div>
                <div class="label">模型原始输出</div>
                <div class="block"><pre>${escapeHtml(scoring.rawOutput || "-")}</pre></div>
              </div>
            `
          ),
          nodeTemplate(
            "PAD",
            pad ? "由 Q1~Q12 计算" : "缺少评分结果",
            pad
              ? `
                  <div class="kv-grid">
                    <div class="kv"><div class="k">P</div><div class="v">${fmt(pad.p)}</div></div>
                    <div class="kv"><div class="k">A</div><div class="v">${fmt(pad.a)}</div></div>
                    <div class="kv"><div class="k">D</div><div class="v">${fmt(pad.d)}</div></div>
                  </div>
                  <div class="block">
                    <pre>P = ${escapeHtml(pad.formulas.p)}
A = ${escapeHtml(pad.formulas.a)}
D = ${escapeHtml(pad.formulas.d)}</pre>
                  </div>
                `
              : `<div class="muted">评分失败时，本轮 PAD 不计算。</div>`
          ),
          nodeTemplate(
            "IDT Delta",
            idt.delta ? "根据 PAD 推导" : "未计算",
            idt.delta
              ? `
                  <div class="kv-grid">
                    <div class="kv"><div class="k">ΔI</div><div class="v">${fmt(idt.delta.i)}</div></div>
                    <div class="kv"><div class="k">ΔD</div><div class="v">${fmt(idt.delta.d)}</div></div>
                    <div class="kv"><div class="k">ΔT</div><div class="v">${fmt(idt.delta.t)}</div></div>
                  </div>
                  <div class="chip-row">
                    <span class="chip">ki ${fmt(idt.delta.coefficients.ki)}</span>
                    <span class="chip">kd ${fmt(idt.delta.coefficients.kd)}</span>
                    <span class="chip">kt ${fmt(idt.delta.coefficients.kt)}</span>
                  </div>
                  <div class="block">
                    <pre>${escapeHtml(idt.delta.formulas.i)}
${escapeHtml(idt.delta.formulas.d)}
${escapeHtml(idt.delta.formulas.t)}</pre>
                  </div>
                `
              : `<div class="muted">本轮未生成 IDT 增量。</div>`
          ),
          nodeTemplate(
            "IDT Next",
            "上一轮与当前轮对比",
            `
              <div class="kv-grid">
                <div class="kv"><div class="k">上一轮 IDT</div><div class="v">${fmt(idt.prev.i)} / ${fmt(idt.prev.d)} / ${fmt(idt.prev.t)}</div></div>
                <div class="kv"><div class="k">当前 IDT</div><div class="v">${fmt(idt.next.i)} / ${fmt(idt.next.d)} / ${fmt(idt.next.t)}</div></div>
              </div>
            `
          ),
          nodeTemplate(
            "State Routing",
            "根据当前 IDT 命中状态区间",
            `
              <div class="chip-row">
                ${
                  routes.matches?.length
                    ? routes.matches
                        .map((item) => `<span class="chip">${escapeHtml(formatRouteItem(item))}</span>`)
                        .join("")
                    : `<span class="chip">${routes.unmatched ? "unmatched" : "未命中"}</span>`
                }
              </div>
              <div class="block">
                <pre>命中状态：${escapeHtml(routeText)}
当前状态：${escapeHtml(primaryRouteText)}</pre>
              </div>
              <div>
                <div class="label">当前状态的数值感知</div>
                <div class="block"><pre>${escapeHtml(primaryPerception)}</pre></div>
              </div>
              <div>
                <div class="label">状态区间规则</div>
                <div class="block"><pre>${escapeHtml(stateRules)}</pre></div>
              </div>
            `
          ),
          nodeTemplate(
            "Assistant Reply",
            `耗时 ${fmt(active.assistant.latencyMs)}ms`,
            `
              <div>
                <div class="label">最终系统提示词</div>
                <div class="block"><pre>${escapeHtml(active.trace.reply.systemPrompt || "-")}</pre></div>
              </div>
              <div>
                <div class="label">回复内容</div>
                <div class="block"><pre>${escapeHtml(active.assistant.content || "(空回复)")}</pre></div>
              </div>
              <div>
                <div class="label">模型思考</div>
                <div class="block"><pre>${escapeHtml(active.assistant.reasoning || "-")}</pre></div>
              </div>
            `
          ),
        ].join("");

        const runEvalBatchBtn = document.getElementById("runEvalBatch");
        if (runEvalBatchBtn) {
          runEvalBatchBtn.addEventListener("click", () => runEvaluationBatch(active.id));
        }
        if (activeTraceTab === "prompts") {
          bindPromptEditorEvents();
        }
        if (activeTraceTab === "roleSettings") {
          bindRoleSettingsEvents();
        }
      }

      async function runEvaluationBatch(roundId) {
        const round = roundId == null ? null : roundTraces.find((item) => item.id === roundId);
        const targetId = round ? roundId : "standalone";
        const requestedRounds = evaluationRounds;
        let workingMessages = round ? round.historySnapshot || history : [];
        let workingIdt = round ? round.nextIdt || currentIdt : currentIdt;
        let detail = [];

        evaluatingBatchRoundId = targetId;
        evaluationProgress = { targetId, completed: 0, total: requestedRounds };
        const initialBatch = buildEvaluationBatchState(detail, requestedRounds, 0, true);
        if (round) {
          round.evaluationBatch = initialBatch;
        } else {
          standaloneEvaluationBatch = initialBatch;
        }
        renderTrace();
        showErr("");

        try {
          for (let index = 0; index < requestedRounds; index += 1) {
            const response = await fetch("/api/evaluate-round", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                messages: workingMessages,
                currentIdt: workingIdt,
                round: index + 1,
                promptOverrides: currentPromptOverrides(),
                kConfig: currentKConfig(),
                roleStateConfig: currentRoleStateConfig(),
                baseProfile: emotionBaseProfile,
                charName: emotionCharName,
              }),
            });
            const data = await readApiResponse(response);
            if (!response.ok) {
              throw new Error(
                data.error?.message ||
                  data.error ||
                  (typeof data === "string" ? data : JSON.stringify(data))
              );
            }

            detail.push(data.detail);
            workingMessages = data.nextMessages || workingMessages;
            workingIdt = data.nextIdt || workingIdt;
            evaluationProgress = { targetId, completed: index + 1, total: requestedRounds };

            const partialBatch = buildEvaluationBatchState(detail, requestedRounds, index + 1, true);
            if (round) {
              round.evaluationBatch = partialBatch;
            } else {
              standaloneEvaluationBatch = partialBatch;
            }
            renderTrace();
          }

          const finalBatch = buildEvaluationBatchState(detail, requestedRounds, requestedRounds, false);
          if (round) {
            round.evaluationBatch = finalBatch;
          } else {
            standaloneEvaluationBatch = finalBatch;
          }
        } catch (error) {
          showErr(error instanceof Error ? error.message : String(error));
        } finally {
          evaluatingBatchRoundId = null;
          evaluationProgress = null;
          renderTrace();
        }
      }

      function startAutoEvaluationSession(round) {
        autoEvaluationCounter += 1;
        const session = {
          id: Date.now() + autoEvaluationCounter,
          sessionNo: autoEvaluationCounter,
          roundId: round.id,
          roundNo: round.roundNo,
          userInput: round.trace?.userInput || "",
          inProgress: true,
          error: "",
          result: null,
        };

        autoEvaluationSessions.unshift(session);
        renderAutoEvaluationSessions();

        (async () => {
          try {
            const replyState = round.trace?.reply?.state || round.trace?.routes?.primary;
            const response = await fetch("/api/evaluate-message", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                stateKey: replyState?.label || "未命中状态",
                directorNotePrompt:
                  replyState?.perception || "当前未命中状态，默认保持克制、理性、审慎。",
                userMessage: round.trace?.userInput || "",
                aiMessage: round.assistant?.content || "",
                promptOverrides: currentPromptOverrides(),
                baseProfile: emotionBaseProfile,
              }),
            });
            const data = await readApiResponse(response);
            if (!response.ok) {
              throw new Error(
                data.error?.message ||
                  data.error ||
                  (typeof data === "string" ? data : JSON.stringify(data))
              );
            }

            session.result = data;
          } catch (error) {
            session.error = error instanceof Error ? error.message : String(error);
          } finally {
            session.inProgress = false;
            renderAutoEvaluationSessions();
          }
        })();
      }

      async function send() {
        const text = inputEl.value.trim();
        if (!text) return;

        showErr("");
        inputEl.value = "";
        history.push({ role: "user", content: text });
        addBubble("user", text);
        sendBtn.disabled = true;

        const loading = addBubble("assistant", "...");

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: history,
              currentIdt,
              promptOverrides: currentPromptOverrides(),
              kConfig: currentKConfig(),
              roleStateConfig: currentRoleStateConfig(),
              baseProfile: emotionBaseProfile,
              charName: emotionCharName,
            }),
          });
          const data = await readApiResponse(response);

          if (!response.ok) {
            loading.remove();
            const msg =
              data.error?.message ||
              data.error ||
              (typeof data === "string" ? data : JSON.stringify(data));
            showErr(`请求失败 (${response.status}): ${msg}`);
            return;
          }

          loading.remove();
          history.push({ role: "assistant", content: data.assistant.content || "" });
          addBubble(
            "assistant",
            data.assistant.content || "(空回复)",
            `回复耗时 ${fmt(data.assistant.latencyMs)}ms`
          );

          currentIdt = data.nextIdt || currentIdt;
          roundCounter += 1;
          const round = {
            id: Date.now() + roundCounter,
            roundNo: roundCounter,
            assistant: data.assistant,
            trace: data.trace,
            nextIdt: data.nextIdt || currentIdt,
            historySnapshot: history.map((item) => ({ role: item.role, content: item.content })),
          };
          roundTraces.unshift(round);
          selectedRoundId = round.id;
          renderTrace();
          renderAutoEvaluationSessions();
          startAutoEvaluationSession(round);
        } catch (error) {
          loading.remove();
          showErr(error instanceof Error ? error.message : String(error));
        } finally {
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      sendBtn.addEventListener("click", send);
      appTabEmotionStrategyEl.addEventListener("click", () => setActiveAppTab("emotionStrategy"));
      appTabRoleFengrongEl.addEventListener("click", () => setActiveAppTab("roleFengrong"));
      appTabRelationStrategyEl.addEventListener("click", () => setActiveAppTab("relationStrategy"));
      appTabSimpleChatEl.addEventListener("click", () => setActiveAppTab("simpleChat"));
      tabNodesEl.addEventListener("click", () => setActiveTab("nodes"));
      tabEvaluationEl.addEventListener("click", () => setActiveTab("evaluation"));
      tabRoleSettingsEl.addEventListener("click", () => setActiveTab("roleSettings"));
      tabPromptsEl.addEventListener("click", () => setActiveTab("prompts"));
      tabDianjingEl.addEventListener("click", () => setActiveTab("dianjing"));
      inputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          send();
        }
      });

      loadPromptDefaults()
        .catch((error) => {
          showErr(error instanceof Error ? error.message : String(error));
        })
        .finally(() => {
          renderAutoEvaluationSessions();
          renderAppView();
          renderTrace();
        });
    </script>
  </body>
</html>
